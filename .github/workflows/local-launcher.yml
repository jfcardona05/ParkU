name: Windows local launcher
on:
  pull_request:
    paths:
      - 'Start-ParkU.ps1'
      - 'docs/ejecutar-local-windows.md'
      - '.github/workflows/local-launcher.yml'
permissions:
  contents: read
jobs:
  powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Windows PowerShell 5.1 syntax
        shell: powershell
        run: |
          $tokens = $null
          $parseErrors = $null
          $path = Join-Path $env:GITHUB_WORKSPACE 'Start-ParkU.ps1'
          [System.Management.Automation.Language.Parser]::ParseFile($path, [ref]$tokens, [ref]$parseErrors) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }
          Write-Host 'Windows PowerShell syntax: OK'
