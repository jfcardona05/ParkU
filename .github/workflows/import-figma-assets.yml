name: Prepare committed frontend sources
on:
  pull_request:
    paths:
      - '.github/workflows/import-figma-assets.yml'
permissions:
  contents: write
jobs:
  prepare:
    if: github.head_ref == 'feature/frontend-figma-responsive' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Resolve asset renderer and format sources
        working-directory: mobile
        run: |
          flutter pub get
          dart format lib test
      - name: Publish dependency lock and formatted code for strict validation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add mobile/pubspec.lock mobile/lib mobile/test
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'style: format Figma integration and lock SVG dependencies'
          git push origin HEAD:feature/frontend-figma-responsive
