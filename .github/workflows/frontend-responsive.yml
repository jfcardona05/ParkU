name: Frontend responsive
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/frontend-responsive.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Generate desktop tablet and mobile previews
        run: flutter test test/responsive_design_test.dart --dart-define=CAPTURE_UI=true --reporter expanded
      - name: Prepare visual review sheet
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import pathlib, base64, io
          pages=['login','home','vehicles','qr','qr-new','transfer','wallet','parking','gate','cash','cash-history','add-vehicle','register']
          widths=[390,834,1440]
          sheet=Image.new('RGB',(1050,260*len(pages)), '#e8e8e5')
          draw=ImageDraw.Draw(sheet)
          for row,page in enumerate(pages):
              for col,width in enumerate(widths):
                  p=pathlib.Path('build/ui-previews')/f'{page}-{width}.png'
                  if not p.exists(): continue
                  original=Image.open(p).convert('RGB')
                  preview=ImageOps.contain(original,(334,225))
                  x=col*350+(350-preview.width)//2
                  y=row*260+26
                  sheet.paste(preview,(x,y))
                  draw.text((col*350+10,row*260+8),f'{page} / {width}px',fill='#191927')
          sheet.save('build/ui-previews/review-sheet.jpg',quality=88)
          output=io.BytesIO()
          sheet.save(output,format='JPEG',quality=78)
          print('PARKU_PREVIEW '+base64.b64encode(output.getvalue()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parku-responsive-previews
          path: mobile/build/ui-previews/
          if-no-files-found: warn
      - run: flutter build web

  api-integration:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: parku_frontend
          POSTGRES_USER: parku
          POSTGRES_PASSWORD: test_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U parku -d parku_frontend"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_URL: jdbc:postgresql://localhost:5432/parku_frontend
      DB_USER: parku
      DB_PASSWORD: test_local
      PARKU_DEMO: 'false'
      PORT: '8000'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - name: Start unchanged backend against disposable PostgreSQL
        working-directory: backend
        run: |
          chmod +x mvnw
          ./mvnw -B -DskipTests package
          nohup java -jar target/*.jar > ../api-integration.log 2>&1 &
      - name: Wait for API and create isolated test accounts
        run: |
          python3 - <<'PY'
          import socket, time, json, urllib.request
          for attempt in range(90):
              try:
                  with socket.create_connection(('localhost',8000),timeout=1): pass
                  break
              except OSError:
                  time.sleep(1)
          else:
              raise RuntimeError('Backend did not start')
          accounts=[
              ('CI student','frontend-student@test.co','pass123'),
              ('CI guard','frontend-guard@test.co','pass123'),
              ('CI admin','frontend-admin@test.co','pass123'),
              ('CI cash','taquilla@usantotomas.edu.co','caja123'),
          ]
          for name,email,password in accounts:
              body=json.dumps(dict(name=name,email=email,password=password)).encode()
              request=urllib.request.Request('http://localhost:8000/api/auth/register',data=body,headers={'Content-Type':'application/json'})
              with urllib.request.urlopen(request) as response:
                  assert response.status == 201
          print('Four disposable integration accounts created')
          PY
      - name: Assign fixture roles in disposable database only
        run: |
          docker exec -i ${{ job.services.postgres.id }} psql -v ON_ERROR_STOP=1 -U parku -d parku_frontend <<'SQL'
          UPDATE users SET role='guard' WHERE email='frontend-guard@test.co';
          UPDATE users SET role='admin' WHERE email='frontend-admin@test.co';
          UPDATE users SET role='operador' WHERE email='taquilla@usantotomas.edu.co';
          SQL
      - run: flutter pub get
      - name: Live registration vehicles wallet and cash recharge
        run: flutter test test/api_live_test.dart --dart-define=LIVE_API=true --reporter expanded
      - name: Live QR entry exit permissions and single charge
        run: >-
          flutter test test/parking_live_test.dart --reporter expanded
          --dart-define=LIVE_PARKING_API=true
          --dart-define=LIVE_STUDENT_EMAIL=frontend-student@test.co
          --dart-define=LIVE_GUARD_EMAIL=frontend-guard@test.co
          --dart-define=LIVE_ADMIN_EMAIL=frontend-admin@test.co
          --dart-define=LIVE_TEST_PASSWORD=pass123
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: frontend-api-integration-log
          path: api-integration.log
