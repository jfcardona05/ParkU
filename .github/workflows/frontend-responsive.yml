name: Frontend responsive
on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/frontend-responsive.yml'
permissions:
  contents: read
jobs:
  responsive:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Check Dart formatting
        run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze
      - run: flutter test --reporter expanded
      - name: Prepare real font for review captures
        run: |
          python3 - <<'PY'
          import pathlib, urllib.request
          target=pathlib.Path('build/preview-font.ttf')
          target.parent.mkdir(parents=True,exist_ok=True)
          with urllib.request.urlopen('https://raw.githubusercontent.com/google/fonts/main/ofl/roboto/Roboto%5Bwdth%2Cwght%5D.ttf') as response:
              target.write_bytes(response.read())
          PY
      - name: Generate desktop tablet and mobile previews
        run: flutter test test/responsive_design_test.dart --dart-define=CAPTURE_UI=true --reporter expanded
      - name: Prepare visual review sheet
        run: |
          python3 -m pip install --quiet Pillow
          python3 - <<'PY'
          from PIL import Image, ImageOps, ImageDraw
          import pathlib, base64, io
          pages=['login','home','vehicles','qr','wallet','parking','gate','cash','add-vehicle','register']
          widths=[390,834,1440]
          sheet=Image.new('RGB',(1050,260*len(pages)), '#e8e8e5')
          draw=ImageDraw.Draw(sheet)
          for row,page in enumerate(pages):
              for col,width in enumerate(widths):
                  p=pathlib.Path('build/ui-previews')/f'{page}-{width}.png'
                  if not p.exists(): continue
                  original=Image.open(p).convert('RGB')
                  preview=ImageOps.contain(original,(334,225))
                  x=col*350+(350-preview.width)//2
                  y=row*260+26
                  sheet.paste(preview,(x,y))
                  draw.text((col*350+10,row*260+8),f'{page} / {width}px',fill='#191927')
          sheet.save('build/ui-previews/review-sheet.jpg',quality=88)
          output=io.BytesIO()
          sheet.save(output,format='JPEG',quality=78)
          print('PARKU_PREVIEW '+base64.b64encode(output.getvalue()).decode())
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: parku-responsive-previews
          path: mobile/build/ui-previews/
          if-no-files-found: warn
      - run: flutter build web
