server.port=${PORT:8000}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/parku}
spring.datasource.username=${DB_USER:parku}
spring.datasource.password=${DB_PASSWORD:parku_local}
spring.flyway.enabled=true
spring.jackson.deserialization.fail-on-unknown-properties=true
server.error.include-message=never
parku.demo.enabled=${PARKU_DEMO:false}