<!doctype html><html lang="es"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Encuesta ParkU</title><style>body{font:18px system-ui;max-width:760px;margin:30px auto;padding:20px;background:#f7f7f4;color:#171725}label{display:block;margin:24px 0 8px}input,select,textarea,button{font:inherit;padding:10px;max-width:100%;box-sizing:border-box}fieldset{border:1px solid #777;border-radius:12px;padding:20px}button{margin-top:24px;background:#ffdb4d;border:0;border-radius:8px}textarea{width:100%}</style><h1>Satisfacción con ParkU</h1><p>Participación voluntaria. No escriba nombres, correos, contraseñas ni placas. Sus respuestas solo se guardan en un archivo cuando usted lo descarga; no se envían automáticamente.</p><form id="f"><fieldset><label>Código anónimo P01 a P04</label><input name="codigo" pattern="P0[1-4]" required placeholder="P01"><label>Rol probado</label><select name="rol" required><option>Usuario</option><option>Taquilla</option><option>Portería</option></select><label>Dispositivo</label><input name="dispositivo" required placeholder="Celular Android, iPhone o PC"><label>1. Inicio de sesión y opciones del rol</label><select name="p1" required><option value="">Seleccione</option><option value="1 Muy insatisfecho">1 Muy insatisfecho</option><option value="2 Insatisfecho">2 Insatisfecho</option><option value="3 Neutral">3 Neutral</option><option value="4 Satisfecho">4 Satisfecho</option><option value="5 Muy satisfecho">5 Muy satisfecho</option><option value="No aplica">No aplica</option></select><label>2. Claridad del saldo y movimientos</label><select name="p2" required><option value="">Seleccione</option><option value="1 Muy insatisfecho">1 Muy insatisfecho</option><option value="2 Insatisfecho">2 Insatisfecho</option><option value="3 Neutral">3 Neutral</option><option value="4 Satisfecho">4 Satisfecho</option><option value="5 Muy satisfecho">5 Muy satisfecho</option><option value="No aplica">No aplica</option></select><label>3. Registro de vehículo y consulta del QR</label><select name="p3" required><option value="">Seleccione</option><option value="1 Muy insatisfecho">1 Muy insatisfecho</option><option value="2 Insatisfecho">2 Insatisfecho</option><option value="3 Neutral">3 Neutral</option><option value="4 Satisfecho">4 Satisfecho</option><option value="5 Muy satisfecho">5 Muy satisfecho</option><option value="No aplica">No aplica</option></select><label>4. Claridad de la confirmación del cobro</label><select name="p4" required><option value="">Seleccione</option><option value="1 Muy insatisfecho">1 Muy insatisfecho</option><option value="2 Insatisfecho">2 Insatisfecho</option><option value="3 Neutral">3 Neutral</option><option value="4 Satisfecho">4 Satisfecho</option><option value="5 Muy satisfecho">5 Muy satisfecho</option><option value="No aplica">No aplica</option></select><label>5. Navegación en su dispositivo</label><select name="p5" required><option value="">Seleccione</option><option value="1 Muy insatisfecho">1 Muy insatisfecho</option><option value="2 Insatisfecho">2 Insatisfecho</option><option value="3 Neutral">3 Neutral</option><option value="4 Satisfecho">4 Satisfecho</option><option value="5 Muy satisfecho">5 Muy satisfecho</option><option value="No aplica">No aplica</option></select><label>6. Facilidad del flujo de su rol</label><select name="p6" required><option value="">Seleccione</option><option value="1 Muy insatisfecho">1 Muy insatisfecho</option><option value="2 Insatisfecho">2 Insatisfecho</option><option value="3 Neutral">3 Neutral</option><option value="4 Satisfecho">4 Satisfecho</option><option value="5 Muy satisfecho">5 Muy satisfecho</option><option value="No aplica">No aplica</option></select><label>7. Satisfacción general</label><select name="p7" required><option value="">Seleccione</option><option value="1 Muy insatisfecho">1 Muy insatisfecho</option><option value="2 Insatisfecho">2 Insatisfecho</option><option value="3 Neutral">3 Neutral</option><option value="4 Satisfecho">4 Satisfecho</option><option value="5 Muy satisfecho">5 Muy satisfecho</option><option value="No aplica">No aplica</option></select><label>8. Dificultad encontrada</label><textarea name="p8" required></textarea><label>9. Mejora prioritaria</label><textarea name="p9" required></textarea><label>10. ¿Completó el recorrido? Explique</label><textarea name="p10" required></textarea></fieldset><button>Descargar mi respuesta</button></form><p id="estado" role="status"></p><script>document.getElementById('f').addEventListener('submit',e=>{e.preventDefault();const r=Object.fromEntries(new FormData(e.target));r.fecha=new Date().toISOString();const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(r,null,2)],{type:'application/json'}));a.download='ParkU_Respuesta_'+r.codigo+'.json';a.click();URL.revokeObjectURL(a.href);document.getElementById('estado').textContent='Respuesta descargada. Compártala voluntariamente con el equipo de ParkU. No se envió automáticamente.';});</script></html>
