name: parku_mobile
description: "ParkU - Aplicación Móvil de Parqueadero Prepago (Universidad Santo Tomás)"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.11.0 <4.0.0'

dependencies:
  mobile_scanner: 7.0.1
  flutter:
    sdk: flutter
  web: ^1.1.1
  http: ^1.2.0
  flutter_svg: ^2.2.0
  qr_flutter: ^4.1.0
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/vehicles/
  fonts:
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf
